name: PMO-Pantelleria flight monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  check-availability:
    runs-on: ubuntu-latest

    env:
      PMO_PNL_MONITOR_URL: ${{ secrets.PMO_PNL_MONITOR_URL }}
      PMO_PNL_CITY_PAIR: ${{ vars.PMO_PNL_CITY_PAIR }}
      PMO_PNL_DEPARTURE_DATE: ${{ vars.PMO_PNL_DEPARTURE_DATE }}
      PMO_PNL_RETURN_DATE: ${{ vars.PMO_PNL_RETURN_DATE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PMO_PNL_CHECK_INTERVAL_SECONDS: "300"
      RUN_ONCE: "true"
      SILENT_START: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore cached state
        uses: actions/cache/restore@v4
        with:
          path: .pmo_pantelleria_state.json
          key: pmo-pantelleria-state-${{ github.run_id }}
          restore-keys: |
            pmo-pantelleria-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run availability check
        run: python pmo_pantelleria_monitor.py

      - name: Save updated state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pmo_pantelleria_state.json
          key: pmo-pantelleria-state-${{ github.run_id }}
